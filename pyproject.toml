[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wake"
version = "0.1.0"
description = "Schedule and fire wake-up tasks across a server/device pair"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["cli", "scheduler", "wake-on-lan", "hotline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  # ownbox.yaml is parsed by tests/test_deployment.py only; wake itself keeps
  # its zero-dependency runtime.
  "pyyaml>=6.0,<7",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
wake = "wake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wake"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
